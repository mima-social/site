<!doctype html><html lang="en"><head><meta charset="utf-8">
<!-- Template for Labs share images (site-assets/og/labs.jpg, labs-<slug>.jpg).
     learn-src/og.py loads it with the post's text in the URL hash:
     #{"title": "...", "tag": "Engineering", "shot": "/site-assets/app/board.webp",
       "name": "...", "role": "...", "photo": "", "initials": "DM", "date": "23 Nov 2026"}
     The sleeve style: Ube Night ground, the hero figure in a window, and the
     lime credits band. Designed at 1200 × 630 (rendered at 2×). -->
<link rel="stylesheet" href="../launch.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:var(--a-950);position:relative;font-family:var(--font-ui);color:#fff}
.top{position:absolute;left:72px;top:54px;display:flex;align-items:center;gap:16px}
.wm{width:132px;height:auto;color:#fff}
.wm .wordmark-m{stroke-dashoffset:0}.wm .wordmark-ima{opacity:1}
.tag{font:600 22px/1 var(--font-ui);color:#e6f81a;white-space:nowrap;padding-top:6px}
.draft{position:absolute;right:72px;top:58px;font:600 20px/1 var(--font-ui);background:var(--a-100);color:var(--a-900);padding:10px 16px;border-radius:999px}
.draft[hidden]{display:none}
h1{position:absolute;left:72px;top:142px;width:600px;height:300px;margin:0;
   font:800 76px/1 var(--font-display);letter-spacing:-0.025em;text-wrap:balance}
.sub{position:absolute;left:72px;top:250px;width:560px;margin:0;font:400 34px/1.35 var(--font-ui);color:var(--a-200);text-wrap:pretty}
.sub:empty{display:none}
.shot{position:absolute;left:716px;top:120px;width:620px;height:418px;border-radius:16px;overflow:hidden;background:#f8f8f8;box-shadow:0 30px 70px rgba(17,17,17,.4)}
.shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:left top}
.credits{position:absolute;left:72px;bottom:44px;display:flex;align-items:center;gap:18px;background:#e6f81a;color:var(--ink);border-radius:24px;padding:16px 30px 16px 18px;box-shadow:0 24px 60px rgba(17,17,17,.3)}
.credits[hidden]{display:none}
.face{width:72px;height:72px;border-radius:50%;background:var(--a-900);color:#fff;font:800 26px/72px var(--font-display);text-align:center;object-fit:cover}
.credits b{display:block;font:600 28px/1.15 var(--font-ui)}
.credits div span{font:400 21px/1.3 var(--font-ui)}
</style></head><body>

636 32.0759C86.5624 32.0759 88.2704 30.4977 88.425 28.3269C88.4299 28.3145 88.4217 27.7153 88.4211 27.6482C88.244 25.5031 86.5476 23.95 84.636 23.9499ZM48.7658 17.5329C49.3123 16.506 50.8251 16.2429 52.1457 16.9451C53.4666 17.6474 54.0953 19.0495 53.5491 20.0769C53.0027 21.1041 51.489 21.367 50.1682 20.6648C48.8473 19.9625 48.2197 18.5603 48.7658 17.5329Z" fill="currentColor" /></svg><span class="tag" id="tag"></span></div>
<span class="draft" id="draft" hidden>Draft, not published</span>
<h1 id="title"></h1>
<p class="sub" id="sub"></p>
<div class="shot"><img id="shot" src="../site-assets/app/board.webp" alt=""></div>
<div class="credits" id="credits" hidden><span class="face" id="face"></span><div><b id="name"></b><span id="role"></span></div></div>
<script>
  var d = JSON.parse(decodeURIComponent(location.hash.slice(1) || "{}"));
  document.getElementById("tag").textContent = d.tag ? "Labs · " + d.tag : "Labs";
  document.getElementById("shot").src = ".." + (d.shot || "/site-assets/app/board.webp");
  document.getElementById("draft").hidden = !d.draft;
  var h = document.getElementById("title");
  h.textContent = d.title || "";
  document.getElementById("sub").textContent = d.sub || "";
  if (d.name) {
    document.getElementById("credits").hidden = false;
    document.getElementById("name").textContent = d.name;
    document.getElementById("role").textContent = [d.role, d.date].filter(Boolean).join(" · ");
    var face = document.getElementById("face");
    if (d.photo) { var img = new Image(); img.src = ".." + d.photo; img.className = "face"; img.alt = ""; face.replaceWith(img); }
    else face.textContent = d.initials || "";
  }
  // Shrink until the title fits its box in at most four lines (76px down to 48px).
  document.fonts.ready.then(function () {
    var size = 76;
    var lines = function () { return Math.round(h.scrollHeight / size); };
    while (size > 48 && (h.scrollHeight > h.clientHeight || lines() > 4)) { size -= 2; h.style.fontSize = size + "px"; }
    document.body.setAttribute("data-ready", "1");
  });
</script>
</body></html>
